<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>英語設問 AI校正ツール</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&family=DM+Sans:wght@400;500;600&display=swap');

  :root {
    --bg: #F5F4F0;
    --surface: #FFFFFF;
    --surface2: #F0EEE8;
    --border: #DDD9CE;
    --text: #1A1916;
    --text-sub: #6B6860;
    --accent: #1B4FD8;
    --accent-light: #EBF0FF;
    --warn: #D4700A;
    --warn-light: #FFF4E5;
    --ok: #1A7A4A;
    --ok-light: #E8F7EE;
    --error: #C02B2B;
    --error-light: #FDEAEA;
    --shadow: 0 2px 12px rgba(0,0,0,0.07);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'DM Sans', 'Noto Sans JP', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    font-size: 14px;
  }

  /* Header */
  .header {
    background: var(--text);
    color: white;
    padding: 0 24px;
    height: 52px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .header-left {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .logo {
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.02em;
  }
  .logo span {
    color: #6EC4FF;
  }
  .badge {
    background: var(--accent);
    color: white;
    font-size: 10px;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 20px;
    letter-spacing: 0.05em;
  }

  /* Subject Switch Tabs */
  .subject-tabs {
    display: flex;
    align-items: center;
    gap: 4px;
    background: rgba(255,255,255,0.1);
    padding: 4px;
    border-radius: 8px;
  }
  .subject-tab {
    background: transparent;
    border: none;
    color: rgba(255,255,255,0.6);
    font-size: 13px;
    font-weight: 500;
    padding: 5px 18px;
    border-radius: 5px;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.15s;
    letter-spacing: 0.03em;
  }
  .subject-tab:hover {
    background: rgba(255,255,255,0.15);
    color: white;
  }
  .subject-tab.active {
    background: white;
    color: var(--text);
    font-weight: 700;
  }

  .header-right {
    display: flex;
    align-items: center;
    gap: 16px;
    font-size: 13px;
    color: #AAA;
  }
  .user-chip {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .avatar {
    width: 26px;
    height: 26px;
    background: var(--accent);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: 700;
    color: white;
  }

  /* Layout */
  .app {
    display: grid;
    grid-template-columns: 260px 1fr 320px;
    grid-template-rows: 1fr;
    height: calc(100vh - 52px);
  }

  /* Sidebar */
  .sidebar {
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .sidebar-section {
    padding: 16px;
    border-bottom: 1px solid var(--border);
  }
  .sidebar-label {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-sub);
    margin-bottom: 10px;
  }
  .upload-area {
    border: 2px dashed var(--border);
    border-radius: 8px;
    padding: 20px 12px;
    text-align: center;
    cursor: pointer;
    transition: all 0.2s;
    background: var(--bg);
  }
  .upload-area:hover {
    border-color: var(--accent);
    background: var(--accent-light);
  }
  .upload-icon { font-size: 22px; margin-bottom: 6px; }
  .upload-text { font-size: 12px; color: var(--text-sub); line-height: 1.5; }
  .upload-text strong { color: var(--accent); }

  .file-list { display: flex; flex-direction: column; gap: 4px; }
  .file-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 10px;
    border-radius: 6px;
    cursor: pointer;
    transition: background 0.15s;
    border: 1px solid transparent;
  }
  .file-item:hover { background: var(--surface2); }
  .file-item.active {
    background: var(--accent-light);
    border-color: var(--accent);
  }
  .file-icon { font-size: 16px; }
  .file-info { flex: 1; min-width: 0; }
  .file-name {
    font-size: 12px;
    font-weight: 500;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .file-meta { font-size: 10px; color: var(--text-sub); }
  .file-status {
    width: 6px; height: 6px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .status-done { background: var(--ok); }
  .status-warn { background: var(--warn); }
  .status-pending { background: var(--border); }

  .check-options { display: flex; flex-direction: column; gap: 8px; }
  .check-option {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    cursor: pointer;
  }
  .check-option input { accent-color: var(--accent); width: 14px; height: 14px; }

  .run-btn {
    margin: 16px;
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 8px;
    padding: 12px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: all 0.2s;
    font-family: inherit;
  }
  .run-btn:hover { background: #1540B0; transform: translateY(-1px); box-shadow: 0 4px 12px rgba(27,79,216,0.3); }

  /* Main Editor */
  .main {
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background: var(--bg);
  }

  .toolbar {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 10px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .toolbar-left { display: flex; align-items: center; gap: 12px; }
  .doc-title { font-size: 14px; font-weight: 600; }
  .doc-meta { font-size: 11px; color: var(--text-sub); }
  .toolbar-right { display: flex; align-items: center; gap: 8px; }
  .btn-ghost {
    background: none;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 12px;
    font-size: 12px;
    cursor: pointer;
    font-family: inherit;
    color: var(--text);
    display: flex;
    align-items: center;
    gap: 4px;
    transition: all 0.15s;
  }
  .btn-ghost:hover { background: var(--surface2); }
  .btn-primary {
    background: var(--ok);
    color: white;
    border: none;
    border-radius: 6px;
    padding: 6px 14px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    display: flex;
    align-items: center;
    gap: 4px;
    transition: all 0.15s;
  }
  .btn-primary:hover { background: #145C38; }

  .editor-area {
    flex: 1;
    overflow-y: auto;
    padding: 24px;
  }

  .question-block {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    margin-bottom: 16px;
    overflow: hidden;
    transition: box-shadow 0.2s;
  }
  .question-block:hover { box-shadow: var(--shadow); }
  .question-block.has-issue { border-left: 3px solid var(--warn); }
  .question-block.has-error { border-left: 3px solid var(--error); }
  .question-block.clean { border-left: 3px solid var(--ok); }

  .q-header {
    padding: 10px 16px;
    background: var(--surface2);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .q-num {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.05em;
    color: var(--text-sub);
  }
  .q-tags { display: flex; gap: 4px; }
  .tag {
    font-size: 10px;
    font-weight: 500;
    padding: 2px 7px;
    border-radius: 20px;
  }
  .tag-warn { background: var(--warn-light); color: var(--warn); }
  .tag-error { background: var(--error-light); color: var(--error); }
  .tag-ok { background: var(--ok-light); color: var(--ok); }
  .tag-info { background: var(--accent-light); color: var(--accent); }

  .q-body { padding: 16px; }
  .q-text {
    font-size: 13px;
    line-height: 1.8;
    font-family: 'IBM Plex Mono', monospace;
    white-space: pre-wrap;
  }
  .highlight-warn {
    background: var(--warn-light);
    border-bottom: 2px solid var(--warn);
    cursor: pointer;
    border-radius: 2px;
    padding: 0 2px;
  }
  .highlight-warn:hover { background: #FFE8C0; }
  .highlight-error {
    background: var(--error-light);
    border-bottom: 2px solid var(--error);
    cursor: pointer;
    border-radius: 2px;
    padding: 0 2px;
  }

  .q-footer {
    padding: 8px 16px;
    border-top: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .issue-count { font-size: 11px; color: var(--text-sub); }
  .accept-all {
    font-size: 11px;
    color: var(--accent);
    cursor: pointer;
    font-weight: 500;
    border: none;
    background: none;
    font-family: inherit;
  }
  .accept-all:hover { text-decoration: underline; }

  /* Right Panel */
  .panel {
    background: var(--surface);
    border-left: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .panel-tabs {
    display: flex;
    border-bottom: 1px solid var(--border);
  }
  .panel-tab {
    flex: 1;
    padding: 12px;
    font-size: 12px;
    font-weight: 500;
    text-align: center;
    cursor: pointer;
    color: var(--text-sub);
    border-bottom: 2px solid transparent;
    transition: all 0.15s;
  }
  .panel-tab.active {
    color: var(--accent);
    border-bottom-color: var(--accent);
  }

  .panel-content { flex: 1; overflow-y: auto; padding: 16px; }

  .issue-card {
    border: 1px solid var(--border);
    border-radius: 8px;
    margin-bottom: 12px;
    overflow: hidden;
  }
  .issue-card.selected { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-light); }
  .issue-head {
    padding: 10px 12px;
    display: flex;
    align-items: flex-start;
    gap: 8px;
    cursor: pointer;
  }
  .issue-icon { font-size: 14px; margin-top: 1px; flex-shrink: 0; }
  .issue-info { flex: 1; }
  .issue-type { font-size: 10px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; margin-bottom: 3px; }
  .issue-type.warn { color: var(--warn); }
  .issue-type.error { color: var(--error); }
  .issue-type.info { color: var(--accent); }
  .issue-desc { font-size: 12px; line-height: 1.5; }

  .issue-body {
    border-top: 1px solid var(--border);
    padding: 12px;
    background: var(--bg);
  }
  .diff-row {
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin-bottom: 10px;
  }
  .diff-label { font-size: 10px; font-weight: 600; color: var(--text-sub); margin-bottom: 2px; }
  .diff-before {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    padding: 8px;
    background: var(--error-light);
    border-radius: 4px;
    color: var(--error);
    text-decoration: line-through;
  }
  .diff-after {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    padding: 8px;
    background: var(--ok-light);
    border-radius: 4px;
    color: var(--ok);
  }
  .reason {
    font-size: 11px;
    color: var(--text-sub);
    line-height: 1.6;
    padding: 8px;
    background: var(--surface2);
    border-radius: 4px;
    margin-bottom: 10px;
  }
  .issue-actions { display: flex; gap: 6px; }
  .btn-accept {
    flex: 1;
    background: var(--ok);
    color: white;
    border: none;
    border-radius: 5px;
    padding: 7px;
    font-size: 11px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.15s;
  }
  .btn-accept:hover { background: #145C38; }
  .btn-reject {
    flex: 1;
    background: none;
    color: var(--error);
    border: 1px solid var(--error);
    border-radius: 5px;
    padding: 7px;
    font-size: 11px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.15s;
  }
  .btn-reject:hover { background: var(--error-light); }

  /* Summary */
  .summary-card {
    background: var(--bg);
    border-radius: 8px;
    padding: 14px;
    margin-bottom: 16px;
    border: 1px solid var(--border);
  }
  .summary-title { font-size: 11px; font-weight: 700; margin-bottom: 12px; color: var(--text-sub); letter-spacing: 0.05em; text-transform: uppercase; }
  .summary-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .stat-item { text-align: center; padding: 10px 8px; background: var(--surface); border-radius: 6px; border: 1px solid var(--border); }
  .stat-num { font-size: 22px; font-weight: 700; line-height: 1; }
  .stat-label { font-size: 10px; color: var(--text-sub); margin-top: 3px; }
  .stat-error .stat-num { color: var(--error); }
  .stat-warn .stat-num { color: var(--warn); }
  .stat-ok .stat-num { color: var(--ok); }
  .stat-total .stat-num { color: var(--text); }

  .progress-bar {
    height: 6px;
    background: var(--border);
    border-radius: 99px;
    margin: 12px 0 4px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--ok), #52C97A);
    border-radius: 99px;
    width: 35%;
    transition: width 0.5s ease;
  }
  .progress-label { font-size: 11px; color: var(--text-sub); }

  .divider { height: 1px; background: var(--border); margin: 16px 0; }

  .comment-area { margin-top: 16px; }
  .comment-input {
    width: 100%;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 10px;
    font-size: 12px;
    font-family: inherit;
    resize: none;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
  }
  .comment-input:focus { outline: none; border-color: var(--accent); }

  .status-pill {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 11px;
    padding: 3px 8px;
    border-radius: 20px;
    font-weight: 500;
  }
  .pill-processing { background: var(--accent-light); color: var(--accent); }
  .pill-done { background: var(--ok-light); color: var(--ok); }

  .dot-pulse {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--accent);
    animation: pulse 1.2s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:0.4;transform:scale(0.8)} }

  .section-divider {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-sub);
    padding: 12px 16px 4px;
    border-top: 1px solid var(--border);
    margin-top: 4px;
  }

  /* 4タブ対応：パネルタブを小さく */
  .panel-tabs .panel-tab {
    padding: 10px 5px;
    font-size: 11px;
    letter-spacing: 0;
  }

  /* Preview Pane */
  .preview-pane {
    flex: 1;
    overflow: hidden;
    display: none;
    flex-direction: column;
    background: #E0DDD6;
  }
  .preview-toolbar {
    padding: 9px 14px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }
  .preview-info { display: flex; align-items: center; gap: 8px; }
  .preview-badge {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--text-sub);
  }
  .preview-approved-count {
    font-size: 10px;
    color: var(--ok);
    font-weight: 600;
    background: var(--ok-light);
    padding: 2px 7px;
    border-radius: 10px;
  }
  .print-btn {
    background: var(--text);
    color: white;
    border: none;
    border-radius: 6px;
    padding: 5px 11px;
    font-size: 11px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    display: flex;
    align-items: center;
    gap: 4px;
    transition: all 0.15s;
  }
  .print-btn:hover { background: #3A3835; }

  .preview-scroll {
    flex: 1;
    overflow-y: auto;
    padding: 20px 16px 32px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
  }

  /* A4 Paper */
  .a4-paper {
    background: white;
    width: 100%;
    min-height: 390px;
    box-shadow: 0 3px 18px rgba(0,0,0,0.18);
    padding: 28px 24px 36px;
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 9px;
    line-height: 1.75;
    color: #1a1916;
  }
  .a4-doc-header { text-align: center; margin-bottom: 10px; }
  .a4-org { font-size: 8px; color: #999; margin-bottom: 2px; letter-spacing: 0.04em; }
  .a4-title { font-size: 15px; font-weight: 700; letter-spacing: 0.18em; color: #111; margin-bottom: 5px; }
  .a4-meta { font-size: 8px; color: #666; display: flex; justify-content: center; gap: 24px; }
  .a4-rule { border: none; border-top: 2px solid #111; margin: 8px 0 14px; }

  .a4-section { margin-bottom: 16px; }
  .a4-section-title {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.05em;
    border-bottom: 1px solid #ccc;
    padding-bottom: 4px;
    margin-bottom: 10px;
    color: #111;
  }
  .a4-question { display: flex; gap: 6px; margin-bottom: 11px; }
  .a4-q-label {
    font-size: 8px;
    font-weight: 600;
    color: #888;
    flex-shrink: 0;
    padding-top: 1px;
    width: 44px;
  }
  .a4-q-body { flex: 1; font-size: 9px; line-height: 1.7; color: #1a1916; }
  .a4-q-instruction { margin-bottom: 4px; color: #555; font-size: 8.5px; }
  .a4-q-passage { margin: 4px 0; line-height: 1.75; }
  .a4-q-choices { font-size: 8.5px; color: #333; margin-top: 5px; line-height: 1.9; }
  .a4-q-sub { font-size: 8.5px; color: #444; margin-top: 3px; }
  .a4-email {
    border: 1px solid #ddd;
    background: #fafafa;
    padding: 7px 9px;
    margin: 5px 0;
    font-size: 8px;
    line-height: 1.65;
    color: #333;
  }
  .a4-blank {
    display: inline-block;
    border-bottom: 1px solid #555;
    min-width: 64px;
    margin: 0 2px;
    vertical-align: bottom;
  }

  /* Correction states */
  .cor-done {
    background: #E8F7EE;
    border-bottom: 1.5px solid #1A7A4A;
    padding: 0 2px;
    color: #0E5C33;
    font-weight: 700;
    border-radius: 1px;
  }
  .cor-pending {
    border-bottom: 1.5px dashed #D4700A;
    padding: 0 1px;
    color: #111;
  }

  /* Legend */
  .preview-legend {
    width: 100%;
    display: flex;
    justify-content: center;
    gap: 16px;
  }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 10px;
    color: var(--text-sub);
  }
  .legend-swatch { width: 16px; height: 3px; border-radius: 1px; }
  .legend-swatch.done { background: #1A7A4A; }
  .legend-swatch.pending { background: #D4700A; }

  @media print {
    .header, .sidebar, .main, .panel-tabs, .preview-toolbar { display: none !important; }
    .app { display: block; height: auto; }
    .panel { border: none; width: 100%; }
    .preview-pane { display: block !important; background: white; }
    .preview-scroll { padding: 0; overflow: visible; }
    .a4-paper { box-shadow: none; padding: 0; }
  }

  /* ── File Tree ─────────────────────────── */
  .tree-root { display: flex; flex-direction: column; }
  .tree-node { }
  .tree-row {
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 4px 6px;
    border-radius: 5px;
    cursor: pointer;
    font-size: 11.5px;
    transition: background 0.12s;
    border: 1px solid transparent;
    user-select: none;
    line-height: 1.4;
  }
  .tree-row:hover { background: var(--surface2); }
  .tree-row.active {
    background: var(--accent-light);
    border-color: var(--accent);
    color: var(--accent);
    font-weight: 600;
  }
  .tree-arrow {
    width: 10px;
    font-size: 9px;
    color: var(--text-sub);
    flex-shrink: 0;
    text-align: center;
    transition: none;
  }
  .tree-ico { font-size: 12px; flex-shrink: 0; line-height: 1; }
  .tree-lbl {
    flex: 1;
    min-width: 0;
    white-space: nowrap;

var activeNodeId = null;

function renderTree(nodes, depth, path) {
  return nodes.map(function(node, i) {
    var id = path + '_' + i;
    if (!node.children) {
      // 科目（葉ノード）
      return '<div class="tree-node tl' + depth + '">' +
        '<div class="tree-row" id="nd_' + id + '" onclick="selectSubject(\'' + node.subject + '\',\'' + id + '\')">' +
          '<span class="tree-arrow"></span>' +
          '<span class="tree-ico">📄</span>' +
          '<span class="tree-lbl">' + node.label + '</span>' +
          (node.q ? '<span class="tree-count">' + node.q + '問</span>' : '') +
          '<span class="tree-dot status-' + node.status + '"></span>' +
        '</div>' +
      '</div>';
    }
    var isOpen = node.open !== false;
    return '<div class="tree-node tl' + depth + '">' +
      '<div class="tree-row" onclick="toggleNode(\'' + id + '\')">' +
        '<span class="tree-arrow" id="ar_' + id + '">' + (isOpen ? '▾' : '▸') + '</span>' +
        '<span class="tree-ico">' + node.icon + '</span>' +
        '<span class="tree-lbl">' + node.label + '</span>' +
      '</div>' +
      '<div class="tree-children' + (isOpen ? '' : ' closed') + '" id="ch_' + id + '">' +
        renderTree(node.children, depth + 1, id) +
      '</div>' +
    '</div>';
  }).join('');
}

function toggleNode(id) {
  var ch = document.getElementById('ch_' + id);
  var ar = document.getElementById('ar_' + id);
  if (!ch) return;
  var closed = ch.classList.toggle('closed');
  if (ar) ar.textContent = closed ? '▸' : '▾';
}

function selectSubject(subject, id) {
  if (activeNodeId) {
    var prev = document.getElementById('nd_' + activeNodeId);
    if (prev) prev.classList.remove('active');
  }
  activeNodeId = id;
  var el = document.getElementById('nd_' + id);
  if (el) el.classList.add('active');
  switchSubject(subject);
}

function buildFileTree() {
  document.getElementById('file-list').innerHTML = renderTree(FILE_TREE, 0, 'n');
  // 初期アクティブ: 進研模試 > 2026年 > 3月 > 英語

  if (el) el.classList.add('active');
}

  } else {

  }
}

  currentSubject = subject;
  const data = SUBJECTS[subject];

  document.title = data.title;
  document.getElementById('logo-subject').textContent = data.logoText;
  document.getElementById('doc-title').textContent = data.docTitle;

  }).join('');

  document.getElementById('editor-area').innerHTML = data.editorHTML;
  document.getElementById('panel-content').innerHTML = data.panelHTML;

  if (currentPanelTab === 3) {
    document.getElementById('preview-pane').innerHTML = getPreviewHTML(subject);
  }

  document.querySelectorAll('.subject-tab').forEach(function(tab) {
    tab.classList.toggle('active', tab.dataset.subject === subject);
  });
}
